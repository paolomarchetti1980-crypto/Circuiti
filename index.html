<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Monkey Roads</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#121315"><link rel="icon" href="icon-192-g3.png"><link rel="apple-touch-icon" href="apple-touch-icon-g3.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Monkey Roads"><meta name="application-name" content="Monkey Roads"><link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">
:root{
  --bg:#121315; --panel:#1b1d20; --panel2:#24272b; --ink:#eef0f2; --muted:#8d939b; --line:#2c3035;
  --accent:#ff7a1a; --accent-ink:#141414; --stage:#0b0c0d; --danger:#ff7a7a;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:500 15px/1.35 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
#root{height:100%}
#app{height:100%;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button,label.btn{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{position:relative;overflow:hidden;cursor:pointer}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer;margin:0;padding:0;border:0}

.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg)}
.wallbtn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px 4px;text-align:left;
  font:700 18px/1.1 "Barlow Semi Condensed",Barlow,sans-serif}
.wallbtn:disabled{opacity:1;cursor:default}
.wallbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wallbtn svg{flex:none;opacity:.6}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.4}
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;background:#2a1d10;border-bottom:1px solid var(--accent);color:#ffd2ad;font-size:14px}
.pubbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}

.stagewrap{position:relative;flex:1;min-height:0;background:var(--stage)}
#box{position:absolute;inset:0;overflow:auto;display:flex;touch-action:pan-x pan-y;overscroll-behavior:contain}
#stage{position:relative;margin:auto;flex:none;user-select:none;-webkit-user-select:none}
#stage.edit{cursor:crosshair}
#stage.linedraw{touch-action:none}
#app.swipeok #box{touch-action:pan-y}
#fcard{touch-action:pan-y}
#photo{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font:700 20px/1 Barlow,sans-serif}
.empty{margin:auto;max-width:340px;padding:24px;text-align:center}
.empty h1{font:700 26px/1.15 "Barlow Semi Condensed",Barlow,sans-serif;margin:0 0 10px}
.empty p{margin:0 0 18px;color:var(--muted)}
.empty .row{justify-content:center}

.dock{background:var(--panel);border-radius:20px 20px 0 0;margin-top:-16px;position:relative;z-index:2;padding:8px 12px 12px;max-height:50vh;overflow:auto;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
.dock::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#3a3e44;margin:0 auto 8px}
.chips{padding:0}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;align-items:center}
.fchip{flex:none;padding:7px 12px;border-radius:999px;background:var(--panel2);border:0;color:#d6d9dd;font:600 13px Barlow,sans-serif}
.fchip.on{background:var(--accent);color:var(--accent-ink)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.lrow:last-child{border-bottom:0}
.lrow.active{background:var(--panel2);border-radius:12px;border-bottom-color:transparent}
.lrow .dot{width:14px;height:14px}
.gb{flex:none;min-width:46px;text-align:center;padding:6px 8px;border-radius:10px;font:800 18px/1 "Barlow Semi Condensed",Barlow,sans-serif;color:#141414;background:#5b6068}
#app.full .dock{display:none}
.fcard{flex:none;margin:-16px 0 0;position:relative;z-index:3;background:var(--panel);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.fcard .btn{min-width:52px;font-size:17px}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini .btn{padding:6px 10px;font-size:13px;border-radius:999px}
.curbar{display:flex;align-items:center;gap:8px;padding:2px 0 6px}
.curbar .cinfo{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 2px;text-align:left}
.ctext{min-width:0;display:flex;flex-direction:column}
.ctext b{font:700 17px/1.15 "Barlow Semi Condensed",Barlow,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctext small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.curbar .dot,.crow .dot{width:22px;height:22px}
.crow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:none;text-align:left;width:100%}
.crow .ctext{flex:1}
.crow.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fsel{flex:none;padding:8px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px Barlow,sans-serif;max-width:170px}
.dot{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(128,128,128,.7)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.hint{flex-basis:100%;margin:0;color:var(--muted);font-size:14px}
.btn{display:inline-block;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:600;text-align:center}
.btn.on{background:var(--panel2);color:var(--accent);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.4}
.btn.big{padding:13px 20px;font-size:17px}

.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.card{width:100%;max-width:540px;max-height:88%;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.card h2{margin:0 0 12px;font:700 21px/1.1 "Barlow Semi Condensed",Barlow,sans-serif}
.field{display:block;margin:0 0 12px;color:var(--muted);font-size:14px}
.field input,.field select,.field textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px Barlow,sans-serif}
.field textarea{min-height:76px;resize:vertical}
.f2{display:flex;gap:10px}.f2 .field{flex:1;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tag{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:#d6d9dd;font:600 13px Barlow,sans-serif}
.tag.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.secbar{display:flex;gap:4px;margin:8px 12px 0;padding:3px;border-radius:12px;background:var(--panel)}
.secbar button{flex:1;border:0;background:none;padding:8px 0;border-radius:9px;font:700 15px "Barlow Semi Condensed",Barlow,sans-serif;letter-spacing:.02em;color:var(--muted)}
.secbar button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
#app.full .secbar{display:none}
#app.home .secbar{display:none}
#empty:has(.home){margin:0;max-width:none;width:100%;height:100%;padding:12px;align-self:stretch}
.home{display:flex;flex-direction:column;gap:12px;height:100%}
.htile{position:relative;flex:1;min-height:0;border:0;border-radius:18px;overflow:hidden;background:var(--panel);padding:0;text-align:left;color:#fff}
.htile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
.htile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.75))}
.hlab{position:absolute;z-index:1;left:18px;bottom:16px;right:18px;display:flex;flex-direction:column;gap:4px}
.hlab b{font:700 38px/1 "Barlow Semi Condensed",Barlow,sans-serif;letter-spacing:.01em}
.hlab small{font:600 15px Barlow,sans-serif;opacity:.9}
#app.grid .dock{display:none}
.archrow{display:block;margin:16px auto 4px;padding:10px 16px;border-radius:999px;border:1px dashed var(--line);background:none;color:var(--muted);font:600 14px Barlow,sans-serif}
.mhead{margin:14px 0 6px;font:700 13px Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrow.warn{border-color:#ffb070;color:#ffb070}
#prevBtn{display:inline-grid;place-items:center}
#prevBtn[hidden]{display:none}
#prevBtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#app.over .dock{max-height:34vh}
.sinfo{padding:0 10px;font-size:12.5px;color:var(--muted);line-height:1.3}
.sinfo b{color:#ffb070;font-weight:600}
.sadd{padding:14px 0;justify-content:center;border-style:dashed;cursor:default}
.sbtns{display:flex;flex-direction:column;gap:6px;padding:4px 10px 0}
.sbtns .btn{width:100%;font-size:14px;padding:9px 8px}
.backbtn{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:10px;background:var(--panel);margin-right:-4px}
#empty:has(.sgrid){margin:0;max-width:none;width:100%;padding:12px;text-align:left;align-self:flex-start}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{display:flex;flex-direction:column;gap:6px;padding:0 0 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;text-align:left}
.sph{display:block;aspect-ratio:4/3;background:#000}
.sph{position:relative}
.sph img{width:100%;height:100%;object-fit:cover;display:block}
.sedit{position:absolute;top:6px;right:6px;padding:5px 10px;border-radius:999px;background:rgba(18,19,21,.82);color:#fff;font:600 13px Barlow,sans-serif;border:1px solid rgba(255,255,255,.25)}
.sname{padding:0 10px;font:700 17px/1.1 "Barlow Semi Condensed",Barlow,sans-serif}
.sdots{display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 10px;font-size:13px;color:var(--muted)}
.sdot{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:600}
.sdot i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.fdot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(128,128,128,.6);padding:0}
.fdot.on{outline:2px solid var(--accent);outline-offset:2px}
.bnotes{margin:10px 0 0;color:#cfd3d8;font-size:14px;white-space:pre-wrap}
.lrow.off{opacity:.55}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid rgba(128,128,128,.6);padding:0}
.sw button.sel{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.list{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.wrow{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:none;text-align:left;font-weight:600}
.wrow.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.wrow small{color:var(--muted);font-weight:500;font-size:14px}
.note{color:var(--muted);font-size:14px;margin:14px 0 0}
.out{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 10px;background:var(--bg)}
.busy{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:10px;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:600;font-size:15px;max-width:92%;pointer-events:none}
.spin{flex:none;width:18px;height:18px;border-radius:50%;border:3px solid rgba(128,128,128,.45);border-top-color:#ff7a1a;animation:spin .8s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:88%;text-align:center}

.menubtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 22px/1 Barlow,sans-serif;padding:0}
.wrow:disabled{opacity:.45}
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  :root{color-scheme:light}
  html,body{height:auto!important;background:#fff!important;color:#111!important}
  #app,#sheet,#toast,#busy{display:none!important}
  #print{display:block!important;font-family:Barlow,Arial,sans-serif;color:#111}
  .ppage{break-after:page;page-break-after:always;display:flex;flex-direction:column;gap:3mm}
  .ppage:last-child{break-after:auto;page-break-after:auto}
  .ppage header{display:flex;justify-content:space-between;font:600 10pt Barlow,Arial,sans-serif;color:#555;border-bottom:.4mm solid #ff7a1a;padding-bottom:2mm}
  .ppage h1{display:flex;align-items:center;gap:3mm;margin:2mm 0 0;font:700 22pt "Barlow Semi Condensed",Arial,sans-serif}
  .ppage h1 i{width:6mm;height:6mm;border-radius:50%;border:.3mm solid #888;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ppage h1 b{margin-left:auto;font-size:20pt;border:.5mm solid #111;border-radius:2mm;padding:0 3mm}
  .pmeta{margin:0;font-size:11pt;color:#333}
  .pnotes{margin:0;font-size:11pt;font-style:italic}
  .pqpage{justify-content:space-between;height:270mm;gap:0}
  .pqr{height:132mm;border:.4mm dashed #bbb;border-radius:4mm;padding:6mm 8mm;display:flex;flex-direction:column;align-items:center;box-sizing:border-box}
  .pqr header{align-self:stretch;display:flex;justify-content:space-between;font:600 10pt Barlow,Arial,sans-serif;color:#555;border-bottom:.4mm solid #ff7a1a;padding-bottom:2mm}
  .pqr h1{margin:4mm 0 1mm;font:700 26pt "Barlow Semi Condensed",Arial,sans-serif;text-align:center}
  .pqsub{margin:0 0 3mm;font-size:12pt;color:#333}
  .pqr .qrsvg{width:72mm;height:72mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pqurl{margin:2mm 0 0;font-size:8pt;color:#777;word-break:break-all;text-align:center}
  .ppage img{width:100%;max-height:205mm;object-fit:contain;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ppage footer{margin-top:auto;font-size:8pt;color:#777}
}

#app.ccomp .stagewrap{flex:0 0 28%}
#app.ccomp .dock{flex:1;max-height:none;margin-top:-16px}
#app.ccomp .zoom{display:none}
#app.ccomp .stagewrap::after{content:"Tocca per schermo intero";position:absolute;right:10px;bottom:26px;padding:5px 10px;border-radius:999px;background:rgba(18,19,21,.8);border:1px solid rgba(255,255,255,.2);font:600 12px Barlow,sans-serif;color:#fff;pointer-events:none}
.sqbar{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;font:600 16px Barlow,sans-serif}
.sqbar span{flex:1}
.sqbar small{color:var(--muted);font-size:13px}
.sqlab{margin:10px 0 4px;color:var(--muted);font:600 12px Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.sqgr span{color:var(--muted)}
.sqhead{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px}
.linklike{border:0;background:none;padding:0;color:var(--accent);font:600 14px Barlow,sans-serif;text-decoration:underline}
.fbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line)}
.hinfo{padding:10px 12px 12px;border-bottom:1px solid var(--line);font-size:14px}
.susbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding:10px 12px;margin:0 0 4px;border:1px solid #ff7a00;border-radius:12px;background:#2a1d10;color:#ffd2ad;font-size:14px}
.susbar span{flex:1 1 100%}
.busy.go{pointer-events:auto;cursor:pointer}
/* computer (mouse): il pannello in basso copre gli ultimi 16px della foto, dove sta la barra di scorrimento orizzontale */
@media (pointer:fine){#box{bottom:16px}.zoom{bottom:26px}}
.fbrow{align-items:flex-start;gap:10px}
.fbrow .fbmsg{display:block;margin:3px 0;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.fbrow.fbdone{opacity:.55}
.dsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}
.dsum div{background:rgba(255,255,255,.05);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.dsum b{font-size:22px}.dsum small{color:var(--muted)}
.dlab{margin:16px 0 8px;font-weight:700}
.dbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:6px}
.dbar i{display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sdot.zero{opacity:.35}
.drow{width:100%;font:inherit;color:inherit;cursor:pointer}
.dtag{border-radius:6px;padding:1px 6px;font-weight:600}
.dtag.ok{background:rgba(35,180,90,.2);color:#5fd38a}.dtag.mid{background:rgba(242,194,0,.2);color:#f2c200}.dtag.old{background:rgba(229,49,43,.22);color:#ff7a74}
.dmiss{display:block;margin-top:5px;color:var(--muted)}
.sname{display:block;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--ink);font:inherit;font-weight:600;padding:4px 6px;margin:0 0 2px -6px}
.sname:focus,.sname:placeholder-shown{border-color:rgba(255,255,255,.18);outline:none}
.newb{display:inline-block;vertical-align:2px;background:#ff7a1a;color:#111;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;border-radius:5px;padding:1px 5px;margin-left:4px}
.snew{display:inline-block;margin-left:6px;background:#ff7a1a;color:#111;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px}
.newb.rec,.snew.rec{background:#ffd9b8}
.snew.exp{background:#e5312b;color:#fff}
.hnew{color:#ff9a4d;font-weight:700}
.qrrow{align-items:center;gap:12px}.qrrow .qrsvg{flex:none;border-radius:6px}
.tk{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:12px;font-weight:800;margin-right:6px;vertical-align:1px}
.tk.done{background:#23b45a;color:#fff}.tk.proj{background:transparent;color:#ffb347;border:1.5px solid #ffb347;font-size:11px}
.tickrow{display:flex;gap:8px;margin-top:12px}
.tbtn{flex:1;font:inherit;font-weight:700;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.22);background:transparent;color:var(--ink);cursor:pointer}
.tbtn.on{background:#23b45a;border-color:#23b45a;color:#fff}.tbtn.on.proj{background:#ffb347;border-color:#ffb347;color:#111}
.voterow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.voterow small{color:var(--muted)}.voterow .seg{flex:1;margin:0}
.tsum{margin:10px 0 0;font-size:13px;color:var(--muted)}
.pbar{display:flex;align-items:center;gap:8px;margin:6px 0}.pbar .pname{width:56px}.pbar b{width:44px;text-align:right}
